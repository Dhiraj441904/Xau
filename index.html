<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XAU Signal Desk</title>
<style>
:root{--bg:#0d0d10;--pn:#16161b;--ln:#2a2a33;--tx:#e8e8ee;--mut:#8a8a99;--ok:#22c55e;--no:#ef4444;--wr:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,system-ui,sans-serif;padding:12px 12px 40px}
h1{font-size:15px;margin:0 0 10px;letter-spacing:.5px}
h1 span{color:var(--mut);font-weight:400;font-size:11px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
.ttl{font-size:11px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #202028;font-size:12px}
.row:last-child{border:0}
.v{text-align:right}
.ok{color:var(--ok)}.no{color:var(--no)}.mut{color:var(--mut)}.wr{color:var(--wr)}
.verdict{font-size:17px;font-weight:700;letter-spacing:1px;padding:6px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.plan div{background:#101015;border:1px solid var(--ln);border-radius:8px;padding:6px}
.plan label{display:block;font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.plan span{font-size:14px;font-weight:700}
label.cf{display:block;font-size:11px;color:var(--mut);margin:8px 0 3px}
input{width:100%;background:#0a0a0d;border:1px solid var(--ln);color:var(--tx);border-radius:7px;padding:8px;font-size:14px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--ok);color:#04240f;font-weight:700;font-size:14px;margin-top:10px}
#log{font:11px/1.5 ui-monospace,monospace;color:var(--mut);max-height:120px;overflow:auto}
</style></head><body>

<h1>XAU SIGNAL DESK <span id="px">—</span></h1>
<div id="engines"></div>

<div class="card">
<label class="cf">Equity USD</label><input id="cfEq" type="number" value="10000">
<label class="cf">Risk % (per trade)</label><input id="cfRisk" type="number" step="0.05" value="0.5">
<label class="cf">Telegram bot token</label><input id="cfTok" placeholder="optional">
<label class="cf">Telegram chat id</label><input id="cfChat" placeholder="optional">
<button id="btn">START</button>
</div>
<div class="card"><div id="log"></div></div>

<script>
const $=i=>document.getElementById(i);
const cfg={eq:10000,risk:0.5,tok:'',chat:''};
let running=false,logs=[],src='';
try{Object.assign(cfg,JSON.parse(localStorage.getItem('xaucfg')||'{}'))}catch(e){}
$('cfEq').value=cfg.eq;$('cfRisk').value=cfg.risk;$('cfTok').value=cfg.tok;$('cfChat').value=cfg.chat;
const log=m=>{logs.unshift(new Date().toLocaleTimeString()+' '+m);logs=logs.slice(0,40);$('log').textContent=logs.join('\n')};
function save(){cfg.eq=+$('cfEq').value;cfg.risk=+$('cfRisk').value;cfg.tok=$('cfTok').value.trim();cfg.chat=$('cfChat').value.trim();localStorage.setItem('xaucfg',JSON.stringify(cfg))}

const DEF={
 scalp:{k:'scalp',label:'SCALP · M5',iv:5,okx:'5m',bn:'5m',sl:0.8,tp1:0.6,tp2:1.2,min:68,cd:6,s0:7,s1:17,atrMin:0.3,atrMax:3},
 swing:{k:'swing',label:'SWING · H1',iv:60,okx:'1H',bn:'1h',sl:2.0,tp1:1.5,tp2:4.0,min:60,cd:3,s0:7,s1:20,atrMin:0.6,atrMax:15}
};
const ENG=[];
for(const k in DEF){const e={...DEF[k],bars:[],plan:null,dir:0,lastSig:-99,lastBar:0,last:null};
 ENG.push(e);
 const d=document.createElement('div');d.className='card';d.id='c_'+k;
 d.innerHTML='<div class="ttl">'+e.label+'</div><div class="verdict mut" id="v_'+k+'">—</div>'+
 '<div id="r_'+k+'"></div><div class="plan" id="p_'+k+'" style="display:none"></div>';
 $('engines').appendChild(d)}

const ema=(a,p)=>{const k=2/(p+1);let o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o};
const sma=(a,p)=>a.map((_,i)=>i<p-1?NaN:a.slice(i-p+1,i+1).reduce((x,y)=>x+y,0)/p);
const rsi=(c,p)=>{let g=0,l=0,o=[];for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],up=d>0?d:0,dn=d<0?-d:0;if(i<=p){g+=up;l+=dn;if(i===p){g/=p;l/=p;o[p]=100-100/(1+g/(l||1e-9))}continue}g=(g*(p-1)+up)/p;l=(l*(p-1)+dn)/p;o[i]=100-100/(1+g/(l||1e-9))}return o};
const atr=(h,l,c,p)=>{const tr=h.map((_,i)=>i?Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])):h[i]-l[i]);let o=[tr[0]];for(let i=1;i<tr.length;i++)o.push((o[i-1]*(p-1)+tr[i])/p);return o};
function adx(h,l,c,p){const pdm=[0],ndm=[0];for(let i=1;i<h.length;i++){const up=h[i]-h[i-1],dn=l[i-1]-l[i];pdm.push(up>dn&&up>0?up:0);ndm.push(dn>up&&dn>0?dn:0)}const a=atr(h,l,c,p),sp=[0],sn=[0];for(let i=1;i<a.length;i++){sp.push((sp[i-1]*(p-1)+pdm[i])/p);sn.push((sn[i-1]*(p-1)+ndm[i])/p)}const dx=a.map((v,i)=>Math.abs(sp[i]-sn[i])/(v||1e-9)*100);let o=[dx[0]];for(let i=1;i<dx.length;i++)o.push((o[i-1]*(p-1)+dx[i])/p);return o}

async function pull(e){
 const t=[
 ['kraken',async()=>{const r=await fetch('https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval='+e.iv);const j=await r.json();return j.result.PAXGUSD.map(x=>({t:x[0]*1000,o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[6]}))}],
 ['okx',async()=>{const r=await fetch('https://www.okx.com/api/v5/market/candles?instId=PAXG-USDT&bar='+e.okx+'&limit=200');const j=await r.json();return j.data.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]})).reverse()}],
 ['binance',async()=>{const r=await fetch('https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval='+e.bn+'&limit=200');const j=await r.json();return j.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}))}]];
 const errs=[];
 for(const[n,f]of t){try{const b=await f();if(b&&b.length>60){src=n;return b}errs.push(n+':short')}catch(x){errs.push(n+':'+x.message)}}
 throw new Error(errs.join(' | ').slice(0,100))}

function hourly(b){const m=new Map();for(const x of b){m.set(Math.floor(x.t/3600000),x.c)}return[...m.values()]}

function analyse(e){
 const B=e.bars,n=B.length,last=n-1;
 const o=B.map(x=>x.o),h=B.map(x=>x.h),l=B.map(x=>x.l),c=B.map(x=>x.c),v=B.map(x=>x.v);
 const e21=ema(c,21),e55=ema(c,55),bArr=ema(hourly(B),200),bias=bArr[bArr.length-1];
 const a14=atr(h,l,c,14),r14=rsi(c,14),ax=adx(h,l,c,14),base=sma(c,20);
 const sd=base.map((b,i)=>{const s=c.slice(Math.max(0,i-19),i+1),m=s.reduce((x,y)=>x+y,0)/s.length;return Math.sqrt(s.reduce((x,y)=>x+(y-m)**2,0)/s.length)});
 const up=base.map((b,i)=>b+2*sd[i]),dn=base.map((b,i)=>b-2*sd[i]),vA=sma(v,20);
 const A=a14[last],R=r14[last],X=ax[last],V=v[last],VA=vA[last];
 const hh=Math.max(...h.slice(last-20,last)),ll=Math.min(...l.slice(last-20,last));
 const bE=c[last-1]<o[last-1]&&c[last]>o[last]&&c[last]>=o[last-1]&&o[last]<=c[last-1];
 const sE=c[last-1]>o[last-1]&&c[last]<o[last]&&o[last]>=c[last-1]&&c[last]<=o[last-1];
 const bd=Math.abs(c[last]-o[last]),rg=h[last]-l[last];
 const bP=rg>0&&(Math.min(o[last],c[last])-l[last])>=bd*2&&c[last]>o[last];
 const sP=rg>0&&(h[last]-Math.max(o[last],c[last]))>=bd*2&&c[last]<o[last];
 const brkU=c[last]>hh,brkD=c[last]<ll,vE=VA>0&&V>=VA*1.6;
 const hr=new Date().getUTCHours(),dw=new Date().getUTCDay(),dom=new Date().getUTCDate(),mo=new Date().getUTCMonth()+1;
 const sessOk=hr>=e.s0&&hr<e.s1;
 const dayOk=dw!==0&&dw!==6&&!(dw===5&&hr>=19);
 const atrOk=A>e.atrMin&&A<e.atrMax;
 const roll=dom>=22&&[1,3,5,7,9,11].includes(mo),nfp=dw===5&&dom<=7;
 let scL=(c[last]>bias?16:0)+(c[last]>e21[last]?5:0)+(e21[last]>e55[last]?5:0)+(X>=20?10:0)+(X>=30?5:0)+(R>=48&&R<=72?14:0)+(brkU?16:0)+(bE?10:0)+(bP?10:0)+((brkU||bE||bP)?6:0)+(l[last]<=dn[last]?10:0)+(vE?12:0);
 let scS=(c[last]<bias?16:0)+(c[last]<e21[last]?5:0)+(e21[last]<e55[last]?5:0)+(X>=20?10:0)+(X>=30?5:0)+(R>=28&&R<=52?14:0)+(brkD?16:0)+(sE?10:0)+(sP?10:0)+((brkD||sE||sP)?6:0)+(h[last]>=up[last]?10:0)+(vE?12:0);
 return{last,A,R,X,V,VA,vE,c:c[last],scL,scS,gate:sessOk&&dayOk&&atrOk&&!roll&&!nfp,
  sessOk,dayOk,atrOk,roll,nfp,brkU,brkD,bE,sE}}
  function render(e,S){
 $('px').textContent='$'+S.c.toFixed(2)+' · '+src;
 const rows=[['Long',S.scL,S.scL>=e.min?'ok':'mut'],['Short',S.scS,S.scS>=e.min?'ok':'mut'],
 ['ADX',S.X.toFixed(1),S.X>=20?'ok':'no'],['RSI',S.R.toFixed(1),'mut'],
 ['ATR',S.A.toFixed(2),S.atrOk?'ok':'no'],['Vol',S.VA>0?(S.V/S.VA).toFixed(2)+'x':'n/a',S.vE?'ok':'mut'],
 ['Sess',S.sessOk?'OPEN':'SHUT',S.sessOk?'ok':'no'],['Day',S.dayOk?'OK':'SHUT',S.dayOk?'ok':'no'],
 ['Roll',S.roll?'YES':'NO',S.roll?'wr':'mut'],['NFP',S.nfp?'YES':'NO',S.nfp?'wr':'mut']];
 $('r_'+e.k).innerHTML=rows.map(r=>'<div class="row"><span>'+r[0]+'</span><b class="v '+r[2]+'">'+r[1]+'</b></div>').join('');
 const v=e.plan?(e.dir>0?'LONG ACTIVE':'SHORT ACTIVE'):(S.gate?'WAITING':'BLOCKED');
 const el=$('v_'+e.k);el.textContent=v;el.className='verdict '+(e.plan?'ok':S.gate?'wr':'no')}

function fire(e,S){
 const riskUsd=cfg.eq*cfg.risk/100,slD=S.A*e.sl;
 const lots=Math.max(0.01,Math.round(riskUsd/(slD*100)*100)/100);
 e.plan={dir:e.dir,entry:S.c,sl:e.dir>0?S.c-slD:S.c+slD,
  tp1:e.dir>0?S.c+S.A*e.tp1:S.c-S.A*e.tp1,tp2:e.dir>0?S.c+S.A*e.tp2:S.c-S.A*e.tp2,lots};
 const p=$('p_'+e.k);p.style.display='grid';
 p.innerHTML='<div><label>Entry</label><span>'+e.plan.entry.toFixed(2)+'</span></div>'+
 '<div><label>SL</label><span class="no">'+e.plan.sl.toFixed(2)+'</span></div>'+
 '<div><label>TP1</label><span class="wr">'+e.plan.tp1.toFixed(2)+'</span></div>'+
 '<div><label>TP2</label><span class="ok">'+e.plan.tp2.toFixed(2)+'</span></div>'+
 '<div><label>Lots</label><span>'+e.plan.lots+'</span></div>'+
 '<div><label>Risk $</label><span>$'+riskUsd.toFixed(2)+'</span></div>';
 log(e.k.toUpperCase()+' '+(e.dir>0?'LONG':'SHORT')+' @ '+e.plan.entry.toFixed(2));
 if(cfg.tok&&cfg.chat){
  const txt='['+e.k.toUpperCase()+'] '+(e.dir>0?'LONG':'SHORT')+' XAUUSD\nEntry '+e.plan.entry.toFixed(2)+'\nSL '+e.plan.sl.toFixed(2)+'\nTP1 '+e.plan.tp1.toFixed(2)+'\nTP2 '+e.plan.tp2.toFixed(2)+'\nLots '+e.plan.lots;
  fetch('https://api.telegram.org/bot'+cfg.tok+'/sendMessage?chat_id='+cfg.chat+'&text='+encodeURIComponent(txt)).catch(()=>{})}}

async function tick(e){
 if(!running)return;
 try{
  const b=await pull(e);
  if(b.length<e.bars.length-5)e.bars=b;else e.bars=b;
  if(e.bars.length<160){log(e.k+' few bars');return}
  const S=analyse(e);render(e,S);
  if(e.plan){
   if(e.plan.dir>0&&(S.c<=e.plan.sl||S.c>=e.plan.tp2))e.plan=null;
   if(e.plan.dir<0&&(S.c>=e.plan.sl||S.c<=e.plan.tp2))e.plan=null;
   if(!e.plan)$('p_'+e.k).style.display='none'}
  const cd=e.bars.length-S.last;
  if(!e.plan&&S.gate&&S.scL>=e.min&&S.scL>S.scS&&cd>e.cd){e.dir=1;fire(e,S)}
  else if(!e.plan&&S.gate&&S.scS>=e.min&&S.scS>S.scL&&cd>e.cd){e.dir=-1;fire(e,S)}
 }catch(x){log(e.k+' ERR '+x.message);const el=$('v_'+e.k);el.textContent='DATA ERROR';el.className='verdict no'}}

const T=[];
$('btn').onclick=()=>{
 if(running){running=false;T.forEach(clearInterval);$('btn').textContent='START';return}
 save();running=true;$('btn').textContent='STOP';
 ENG.forEach(e=>{tick(e);T.push(setInterval(()=>tick(e),e.iv<=5?15000:45000))})};
</script></body></html>
