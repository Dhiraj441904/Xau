<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Asset Desk</title>
<style>
:root{--bg:#0d0d10;--pn:#16161b;--ln:#2a2a33;--tx:#e8e8ee;--mut:#8a8a99;--ok:#22c55e;--no:#ef4444;--wr:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,system-ui,sans-serif;padding:10px 10px 40px}
h1{font-size:13px;margin:0 0 8px;letter-spacing:.5px}
h1 span{color:var(--mut);font-weight:400;font-size:11px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:9px;margin-bottom:9px}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.ttl{font-size:11px;letter-spacing:.8px;color:var(--mut)}
.px{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.sp{width:100%;height:44px;display:block;margin:3px 0}
.up{color:var(--ok)}.dn{color:var(--no)}
.verdict{font-size:12px;font-weight:700;letter-spacing:.8px}
.row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #1e1e26;font-size:11px}
.row:last-child{border:0}
.ok{color:var(--ok)}.no{color:var(--no)}.mut{color:var(--mut)}.wr{color:var(--wr)}
.plan{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:7px}
.plan div{background:#101015;border:1px solid var(--ln);border-radius:6px;padding:5px}
.plan label{display:block;font-size:8px;color:var(--mut);text-transform:uppercase}
.plan span{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.dim{opacity:.4}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.filters button{flex:1;min-width:52px;padding:7px;border:1px solid var(--ln);background:#101015;color:var(--mut);border-radius:7px;font-size:10px}
.filters button.on{background:var(--ok);color:#04240f;border-color:var(--ok);font-weight:700}
label.cf{display:block;font-size:10px;color:var(--mut);margin:7px 0 2px}
input{width:100%;background:#0a0a0d;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:7px;font-size:13px}
#go{width:100%;padding:10px;border:0;border-radius:7px;background:var(--ok);color:#04240f;font-weight:700;margin-top:9px}
#log{font:10px/1.4 ui-monospace,monospace;color:var(--mut);max-height:110px;overflow:auto}
</style></head><body>

<h1>MULTI ASSET DESK <span id="utc"></span></h1>
<div class="filters" id="fl"></div>
<div id="engines"></div>

<div class="card">
<label class="cf">Equity USD</label><input id="cfEq" type="number" value="10000">
<label class="cf">Risk % per trade</label><input id="cfRisk" type="number" step="0.05" value="0.5">
<label class="cf">Telegram token</label><input id="cfTok" placeholder="optional">
<label class="cf">Telegram chat id</label><input id="cfChat" placeholder="optional">
<button id="go">START</button>
</div>
<div class="card"><div id="log"></div></div>

<script>
const $=i=>document.getElementById(i);
const cfg={eq:10000,risk:0.5,tok:'',chat:''};
let running=false,logs=[];
try{Object.assign(cfg,JSON.parse(localStorage.getItem('mad')||'{}'))}catch(e){}
$('cfEq').value=cfg.eq;$('cfRisk').value=cfg.risk;$('cfTok').value=cfg.tok;$('cfChat').value=cfg.chat;
const log=m=>{logs.unshift(new Date().toLocaleTimeString()+' '+m);logs=logs.slice(0,30);$('log').textContent=logs.join('\n')};
setInterval(()=>{$('utc').textContent=new Date().toISOString().slice(11,19)+' UTC'},1000);

const CLS={
 crypto:{sl:1.5,tp1:1.0,tp2:2.5,min:66,cd:5,s0:0,s1:24,d:1,atrMin:0,atrMax:1e6},
 fx:    {sl:1.0,tp1:0.8,tp2:1.8,min:66,cd:5,s0:7,s1:20,d:5,atrMin:0,atrMax:1e6},
 metal: {sl:1.0,tp1:0.8,tp2:1.8,min:66,cd:5,s0:7,s1:20,d:3,atrMin:0,atrMax:1e6},
 oil:   {sl:1.2,tp1:0.9,tp2:2.0,min:68,cd:6,s0:13,s1:20,d:2,atrMin:0,atrMax:1e6},
 micro: {sl:0.4,tp1:0.3,tp2:0.6,min:62,cd:2,s0:0,s1:24,d:2,atrMin:0.8,atrMax:6}
};
const A=[
 ['XAUUSD','XAUUSD=X','Gold','metal',100,2],
 ['XAGUSD','SI=F','Silver','metal',5000,3],
 ['BTCUSD','BTC-USD','Bitcoin','crypto',1,1],
 ['ETHUSD','ETH-USD','Ethereum','crypto',1,2],
 ['EURUSD','EURUSD=X','EUR/USD','fx',100000,5],
 ['GBPUSD','GBPUSD=X','GBP/USD','fx',100000,5],
 ['USDJPY','USDJPY=X','USD/JPY','fx',100000,3],
 ['AUDUSD','AUDUSD=X','AUD/USD','fx',100000,5],
 ['USDCAD','USDCAD=X','USD/CAD','fx',100000,5],
 ['WTI','CL=F','Crude WTI','oil',1000,2],
 ['BRENT','BZ=F','Brent','oil',1000,2]
];
const E=A.map(x=>{const c=CLS[x[3]];return{s:x[0],y:x[1],n:x[2],cat:x[3],v:x[4],d:x[5],iv:'15m',
 ...c,bars:[],plan:null,dir:0,last:null,on:true}});
E.push({s:'XAU-M',y:'XAUUSD=X',n:'GOLD MICRO · M1',cat:'micro',v:100,d:2,iv:'1m',
 ...CLS.micro,bars:[],plan:null,dir:0,last:null,on:true});
E.push({s:'BTC-M',y:'BTC-USD',n:'BTC MICRO · M1',cat:'micro',v:1,d:1,iv:'1m',
 ...CLS.micro,bars:[],plan:null,dir:0,last:null,on:true});

const fl=$('fl');
['ALL','micro','metal','fx','crypto','oil'].forEach((k,i)=>{
 const b=document.createElement('button');b.textContent=k==='ALL'?'ALL':k.toUpperCase();
 if(i===0)b.className='on';
 b.onclick=()=>{document.querySelectorAll('#fl button').forEach(x=>x.className='');
  b.className='on';E.forEach(e=>{e.on=(k==='ALL'||e.cat===k);$('c_'+e.s).style.display=e.on?'':'none'})};
 fl.appendChild(b)});

E.forEach(e=>{const d=document.createElement('div');d.className='card';d.id='c_'+e.s;
 d.innerHTML='<div class="hd"><span class="ttl">'+e.n+'</span><span class="verdict mut" id="v_'+e.s+'">—</span></div>'+
 '<div class="px" id="x_'+e.s+'">—</div><svg class="sp" id="s_'+e.s+'" viewBox="0 0 300 44" preserveAspectRatio="none"></svg>'+
 '<div id="r_'+e.s+'"></div><div class="plan dim" id="p_'+e.s+'"></div>';
 $('engines').appendChild(d)});

const ema=(a,p)=>{const k=2/(p+1);let o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o};
const sma=(a,p)=>a.map((_,i)=>i<p-1?NaN:a.slice(i-p+1,i+1).reduce((x,y)=>x+y,0)/p);
const rsi=(c,p)=>{let g=0,l=0,o=[];for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],u=d>0?d:0,w=d<0?-d:0;if(i<=p){g+=u;l+=w;if(i===p){g/=p;l/=p;o[p]=100-100/(1+g/(l||1e-9))}continue}g=(g*(p-1)+u)/p;l=(l*(p-1)+w)/p;o[i]=100-100/(1+g/(l||1e-9))}return o};
const atr=(h,l,c,p)=>{const t=h.map((_,i)=>i?Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])):h[i]-l[i]);let o=[t[0]];for(let i=1;i<t.length;i++)o.push((o[i-1]*(p-1)+t[i])/p);return o};
function adx(h,l,c,p){const pd=[0],nd=[0];for(let i=1;i<h.length;i++){const u=h[i]-h[i-1],d=l[i-1]-l[i];pd.push(u>d&&u>0?u:0);nd.push(d>u&&d>0?d:0)}const a=atr(h,l,c,p),sp=[0],sn=[0];for(let i=1;i<a.length;i++){sp.push((sp[i-1]*(p-1)+pd[i])/p);sn.push((sn[i-1]*(p-1)+nd[i])/p)}const dx=a.map((v,i)=>Math.abs(sp[i]-sn[i])/(v||1e-9)*100);let o=[dx[0]];for(let i=1;i<dx.length;i++)o.push((o[i-1]*(p-1)+dx[i])/p);return o}

async function pull(e){
 const u='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(e.y)+'?interval='+e.iv+'&range='+(e.iv==='1m'?'1d':'5d');
 const px=['https://api.allorigins.win/raw?url='+encodeURIComponent(u),
           'https://corsproxy.io/?url='+encodeURIComponent(u)];
 for(const p of px){
  try{const r=await fetch(p);const j=await r.json();
   const res=j.chart&&j.chart.result&&j.chart.result[0];if(!res)continue;
   const q=res.indicators.quote[0],ts=res.timestamp;if(!ts)continue;
   const b=[];for(let i=0;i<ts.length;i++){if(q.close[i]==null)continue;
    b.push({t:ts[i]*1000,o:q.open[i],h:q.high[i],l:q.low[i],c:q.close[i],v:q.volume[i]||0})}
   if(b.length>60)return b}catch(x){}
 }
 throw new Error('no data')}

function hourly(b){const m=new Map();for(const x of b)m.set(Math.floor(x.t/36e5),x.c);return[...m.values()]}

function analyse(e){
 const B=e.bars,n=B.length,last=n-1;
 const o=B.map(x=>x.o),h=B.map(x=>x.h),l=B.map(x=>x.l),c=B.map(x=>x.c),v=B.map(x=>x.v);
 const e21=ema(c,21),e55=ema(c,55),ba=ema(hourly(B),200),bias=ba[ba.length-1];
 const a14=atr(h,l,c,14),r14=rsi(c,14),ax=adx(h,l,c,14),base=sma(c,20);
 const sd=base.map((b,i)=>{const s=c.slice(Math.max(0,i-19),i+1),m=s.reduce((x,y)=>x+y,0)/s.length;return Math.sqrt(s.reduce((x,y)=>x+(y-m)**2,0)/s.length)});
 const up=base.map((b,i)=>b+2*sd[i]),dn=base.map((b,i)=>b-2*sd[i]),vA=sma(v,20);
 const At=a14[last],R=r14[last],X=ax[last],V=v[last],VA=vA[last];
 const hh=Math.max(...h.slice(last-20,last)),ll=Math.min(...l.slice(last-20,last));
 const bE=c[last-1]<o[last-1]&&c[last]>o[last]&&c[last]>=o[last-1];
 const sE=c[last-1]>o[last-1]&&c[last]<o[last]&&o[last]>=c[last-1];
 const bd=Math.abs(c[last]-o[last]),rg=h[last]-l[last];
 const bP=rg>0&&(Math.min(o[last],c[last])-l[last])>=bd*2&&c[last]>o[last];
 const sP=rg>0&&(h[last]-Math.max(o[last],c[last]))>=bd*2&&c[last]<o[last];
 const brkU=c[last]>hh,brkD=c[last]<ll,vE=VA>0&&V>=VA*1.6;
 const dw=new Date().getUTCDay(),hm=new Date().getUTCHours()*60+new Date().getUTCMinutes();
 const mktOpen=!(hm>=1435||hm<5)&&!(dw===6||(dw===0&&hm<1320)||(dw===5&&hm>=1260));
 const sessOk=mktOpen;
 const dayOk=e.cat==='crypto'?true:mktOpen;
 const atrOk=At>e.atrMin&&At<e.atrMax;
 let scL=(c[last]>bias?16:0)+(c[last]>e21[last]?5:0)+(e21[last]>e55[last]?5:0)+(X>=20?10:0)+(X>=30?5:0)+(R>=48&&R<=72?14:0)+(brkU?16:0)+(bE?10:0)+(bP?10:0)+((brkU||bE||bP)?6:0)+(l[last]<=dn[last]?10:0)+(vE?12:0);
 let scS=(c[last]<bias?16:0)+(c[last]<e21[last]?5:0)+(e21[last]<e55[last]?5:0)+(X>=20?10:0)+(X>=30?5:0)+(R>=28&&R<=52?14:0)+(brkD?16:0)+(sE?10:0)+(sP?10:0)+((brkD||sE||sP)?6:0)+(h[last]>=up[last]?10:0)+(vE?12:0);
 return{last,A:At,R,X,V,VA,vE,c:c[last],scL,scS,
  gate:((e.cat==='crypto'||e.s==='BTC-M')?atrOk:(dayOk&&atrOk)),sessOk,dayOk,atrOk}}

function render(e,S){
 const el=$('x_'+e.s);const prev=el.dataset.p?+el.dataset.p:S.c;
 el.textContent=S.c.toFixed(e.d);el.className='px '+(S.c>=prev?'up':'dn');el.dataset.p=S.c;
 const pts=e.bars.slice(-60).map(x=>x.c),mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
 $('s_'+e.s).innerHTML='<polyline fill="none" stroke="'+(pts[pts.length-1]>=pts[0]?'#22c55e':'#ef4444')+
  '" stroke-width="1.3" points="'+pts.map((p,i)=>(i/59*300)+','+(44-(p-mn)/rg*40)).join(' ')+'"/>';
 const rows=[['Long',S.scL,S.scL>=e.min?'ok':'mut'],['Short',S.scS,S.scS>=e.min?'ok':'mut'],
  ['ADX',S.X.toFixed(1),S.X>=20?'ok':'no'],['RSI',S.R.toFixed(1),'mut'],
  ['ATR',S.A.toFixed(e.d),S.atrOk?'ok':'no'],
  ['Vol',S.VA>0?(S.V/S.VA).toFixed(2)+'x':'n/a',S.vE?'ok':'mut'],
  ['Mkt',S.sessOk?'OPEN':'SHUT',S.sessOk?'ok':'no']];
 $('r_'+e.s).innerHTML=rows.map(r=>'<div class="row"><span>'+r[0]+'</span><b class="'+r[2]+'">'+r[1]+'</b></div>').join('');
 const v=e.plan?(e.plan.dir>0?'LONG':'SHORT'):(S.gate?'WAIT':'BLOCK');
 const ve=$('v_'+e.s);ve.textContent=v;ve.className='verdict '+(e.plan?'ok':S.gate?'wr':'no');
 const d=e.plan?e.plan.dir:(S.scS>S.scL?-1:1);
 const slD=S.A*e.sl,riskUsd=cfg.eq*cfg.risk/100;
 const pr=e.plan||{dir:d,entry:S.c,sl:d>0?S.c-slD:S.c+slD,
  tp1:d>0?S.c+S.A*e.tp1:S.c-S.A*e.tp1,tp2:d>0?S.c+S.A*e.tp2:S.c-S.A*e.tp2,
  lots:Math.max(0.01,Math.round(riskUsd/(slD*e.v)*100)/100)};
 const p=$('p_'+e.s);p.className='plan'+(e.plan?'':' dim');
 p.innerHTML='<div><label>'+(e.plan?'ENTRY':'preview')+'</label><span>'+pr.entry.toFixed(e.d)+'</span></div>'+
  '<div><label>SL</label><span class="no">'+pr.sl.toFixed(e.d)+'</span></div>'+
  '<div><label>LOT</label><span>'+pr.lots+'</span></div>'+
  '<div><label>TP1</label><span class="wr">'+pr.tp1.toFixed(e.d)+'</span></div>'+
  '<div><label>TP2</label><span class="ok">'+pr.tp2.toFixed(e.d)+'</span></div>'+
  '<div><label>RISK$</label><span>'+riskUsd.toFixed(2)+'</span></div>'}

function fire(e,S){
 const riskUsd=cfg.eq*cfg.risk/100,slD=S.A*e.sl;
 const lots=Math.max(0.01,Math.round(riskUsd/(slD*e.v)*100)/100);
 e.plan={dir:e.dir,entry:S.c,sl:e.dir>0?S.c-slD:S.c+slD,
  tp1:e.dir>0?S.c+S.A*e.tp1:S.c-S.A*e.tp1,tp2:e.dir>0?S.c+S.A*e.tp2:S.c-S.A*e.tp2,lots};
 log(e.s+' '+(e.dir>0?'LONG':'SHORT')+' @ '+S.c.toFixed(e.d));
 if(cfg.tok&&cfg.chat){
  const t=e.s+' '+(e.dir>0?'LONG':'SHORT')+'\nE '+e.plan.entry.toFixed(e.d)+'\nSL '+e.plan.sl.toFixed(e.d)+'\nTP1 '+e.plan.tp1.toFixed(e.d)+'\nTP2 '+e.plan.tp2.toFixed(e.d)+'\nLot '+lots;
  fetch('https://api.telegram.org/bot'+cfg.tok+'/sendMessage?chat_id='+cfg.chat+'&text='+encodeURIComponent(t)).catch(()=>{})}}

async function tick(e){
 if(!running||!e.on)return;
 try{
  e.bars=await pull(e);
  if(e.bars.length<160)return;
  const S=analyse(e);render(e,S);
  if(e.plan){if(e.plan.dir>0&&(S.c<=e.plan.sl||S.c>=e.plan.tp2))e.plan=null;
   if(e.plan.dir<0&&(S.c>=e.plan.sl||S.c<=e.plan.tp2))e.plan=null}
  const cdd=e.bars.length-S.last;
  if(!e.plan&&S.gate&&S.scL>=e.min&&S.scL>S.scS&&cdd>e.cd){e.dir=1;fire(e,S)}
  else if(!e.plan&&S.gate&&S.scS>=e.min&&S.scS>S.scL&&cdd>e.cd){e.dir=-1;fire(e,S)}
 }catch(x){$('v_'+e.s).textContent='ERR';$('v_'+e.s).className='verdict no'}}

const T=[];
$('go').onclick=()=>{
 if(running){running=false;T.forEach(clearInterval);$('go').textContent='START';return}
 cfg.eq=+$('cfEq').value;cfg.risk=+$('cfRisk').value;
 cfg.tok=$('cfTok').value.trim();cfg.chat=$('cfChat').value.trim();
 localStorage.setItem('mad',JSON.stringify(cfg));
 running=true;$('go').textContent='STOP';
 E.forEach((e,i)=>setTimeout(()=>{tick(e);T.push(setInterval(()=>tick(e),e.iv==='1m'?10000:30000))},i*2500))};
</script></body></html>
